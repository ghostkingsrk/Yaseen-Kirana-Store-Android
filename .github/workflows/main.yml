
      - name: Configure resilient Maven repositories
        shell: bash
        run: |
          set -euo pipefail
          cat > source/Yaseen_Android_NewRepo/settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  maven {
                      name = 'GoogleHostedMavenCentralMirror'
                      url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
                  }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  maven {
                      name = 'GoogleHostedMavenCentralMirror'
                      url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
                  }
                  mavenCentral()
              }
          }
          rootProject.name = 'YaseenKiranaAndroid'
          include ':app'
          GRADLE
          echo "Maven mirror configured."
          grep -q 'GoogleHostedMavenCentralMirror' source/Yaseen_Android_NewRepo/settings.gradle
          grep -q 'minSdk 23' source/Yaseen_Android_NewRepo/app/build.gradle
