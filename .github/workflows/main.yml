
name: Yaseen Kirana Store - Signed APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Yaseen_Kirana_Store_Android_NewRepo_Source_v1.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check signing secrets
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Extract Android source ZIP
        run: |
          unzip -q Yaseen_Kirana_Store_Android_NewRepo_Source_v1.zip -d source
          test -f source/Yaseen_Android_NewRepo/app/build.gradle
          test -f source/Yaseen_Android_NewRepo/settings.gradle
          test -f source/Yaseen_Android_NewRepo/app/google-services.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare and verify signing key
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yaseen-release.jks"
          test -s "$RUNNER_TEMP/yaseen-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/yaseen-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/yaseen-release.jks" >> "$GITHUB_ENV"

      - name: Build Customer and Admin signed Release APKs
        working-directory: source/Yaseen_Android_NewRepo
        run: |
          gradle --no-daemon :app:assembleCustomerRelease :app:assembleAdminRelease

      - name: Verify and collect APKs
        shell: bash
        run: |
          mkdir -p dist
          cp source/Yaseen_Android_NewRepo/app/build/outputs/apk/customer/release/*.apk dist/Yaseen-Kirana-Customer.apk
          cp source/Yaseen_Android_NewRepo/app/build/outputs/apk/admin/release/*.apk dist/Yaseen-Kirana-Admin.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          echo "BUILD_TYPE=signed-release" > dist/BUILD_INFO.txt

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: Yaseen-Kirana-Store-Signed-APKs
          path: dist/*
          if-no-files-found: error
          retention-days: 90
